services:
  - type: web
    name: clipforge-ai
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: "production"
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: "https://wqwlqbozwcbcxjbxlqmh.supabase.co"
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_BASE_URL
        value: "https://api.groq.com/openai/v1"
      - key: GROQ_MODEL
        value: "llama-3.3-70b-versatile"
      - key: CEREBRAS_API_KEY
        sync: false
      - key: CEREBRAS_BASE_URL
        value: "https://api.cerebras.ai/v1"
      - key: CEREBRAS_MODEL
        value: "llama3.1-70b"
      - key: CLOUDFLARE_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: ZENSERP_API_KEY
        sync: false
      - key: YOUTUBE_COOKIES
        sync: false


